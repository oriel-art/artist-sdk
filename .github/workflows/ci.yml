name: SDK checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: google-chrome --version
      - run: npm run test:browser
      - run: npm run size
      - run: npm pack --dry-run
